<!doctype html>
<!--
  Netlify Forms registry. Netlify discovers forms by parsing static HTML at
  deploy time and never runs the React app, so every form the app submits is
  declared here too, with the same name and the same fields. The app POSTs to
  this file's path. Never linked, never shown.
  contact    — src/components/ContactForm.tsx (the /contact page and the dialog)
  contribute — src/pages/Contribute.tsx (the pasted HTML arrives as html_file)
  sponsor    — src/pages/Sponsor.tsx (SPONSOR in the sidebar nav: request info)
  new-drops  — src/hooks/useSubscribe.ts (the sidebar's NEW DROPS field)
  template-feedback — src/components/TemplateFeedback.tsx (FEEDBACK in the prompt modal; the
               template is sent as hidden fields, and `subject` names it in the notification email)
  How they post: src/lib/netlifyForms.ts
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="contribute" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="contribute" />
      <input name="bot-field" />
      <input name="template_name" />
      <textarea name="template_description"></textarea>
      <input name="submitter_name" />
      <input type="url" name="social_1" />
      <input type="url" name="social_2" />
      <input name="html_bytes" />
      <input type="file" name="html_file" />
    </form>
    <form name="sponsor" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="sponsor" />
      <input name="bot-field" />
      <input name="name" />
      <input type="email" name="email" />
      <input name="company" />
      <input type="url" name="website" />
      <input name="interests" />
      <textarea name="message"></textarea>
    </form>
    <form name="template-feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="template-feedback" />
      <input name="bot-field" />
      <input type="hidden" name="subject" />
      <input name="template" />
      <input name="template_slug" />
      <input type="url" name="template_url" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="new-drops" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="new-drops" />
      <input type="email" name="email" />
    </form>
  </body>
</html>
