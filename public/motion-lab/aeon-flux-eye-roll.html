        <path d="M426.500 277s-8.820 12-30.410-9.500-54.790-79.296-112.220-76.304c0 0 44.335-.047 95.103 65.164 37.090 47.640 50.527 29.807 50.527 29.807s1-7.167-3-9.167z"/>
        <path d="M451.843 262S438.500 263.667 426 238.333s-30.263-41.898-57.397-44.364-22.936-11.285-22.936-11.285-4.860 15.182 25.736 16.248S418.500 240.520 418.500 240.260s11.686 33.710 33.343 33.975c4.102-9.533 0-12.235 0-12.235z"/>
        <path d="M459.500 259.500s2.834 2.270 5.167-7.115-15.463-68.672 43.833-62.744c0 0-43.500-5.473-36.500 61.693 0 0 0 16.667-12.500 8.167z"/>
        <path d="M483 244s3.500 2.020 6.500-3.740 17.987-55.280 62.834-63.790c0 0-39.710 8.756-52.333 58.864 0 0-7.666 25.582-19 9.010"/>
        <path d="M522 229.193s2.668 3.727 8.334-.733 23.463-60.176 71.064-61.568c0 0-30.950-.630-62.898 57.678 0 0-5.500 14.930-16.500 11.930 0 0-5-3.114 0-7.307z"/>
        <path d="M549.500 224.570s5.176 1.062 11.088-4.754 51.580-52.514 73.746-50.415c0 0-20.938-4.400-63.886 48.600 0 0-19.835 22.887-20.948 6.570z"/>
      </g>

      <!-- the original AEON FLUX lettering, replaced: same place, same ink, same 85% -->
      <g id="Text">
        <text id="title" x="400" y="508" text-anchor="middle" font-size="47" letter-spacing="2.4" fill="#301550" opacity=".85">INSTALANDING.AI</text>
      </g>
    </svg>

<script>
/* ------------------------------------------------------------------
   The eye: one 7s timeline drawn by a single render(t). Nothing tweens
   on its own; every frame sets each SVG transform from the time, so the
   clip can be played, looped, stepped or scrubbed to any instant.
     0.0s   still: the eye stares, the fly waits on the lashes
     1.0s   the fly wakes (wings, a jittering body, lashes that shiver);
            the iris rolls along a soft bezier, growing from 0.6 to 1
     1.5s   the right-hand veins slide in and grow
     1.85s  the iris narrows to 0.7 wide as it reaches the corner
     2.1s   the left-hand veins shrink away
     2.6s   the pupil tightens to 0.45
     3.4s   the title fades in over 1s
   ------------------------------------------------------------------ */
(function () {
  const DUR = 7, HOLD = 1.6;
  const $ = (s) => document.querySelector(s);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const win = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, x) => a + (b - a) * x;
  // GSAP's eases as plain functions: power1.out, power1.inOut, power2.inOut
  const p1Out = (x) => 1 - (1 - x) * (1 - x);
  const p1IO = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  const p2IO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const hash = (a, b) => { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); };

  // ---- the beats, in seconds ----
  const A = 1.0;                 // eye roll starts; the fly wakes
  const ROLL_B = A + 1.6;        // bezier + scale done
  const SQX_A = ROLL_B - 0.75;   // iris narrows to scaleX 0.7 over 0.6
  const PUP_A = ROLL_B, PUP_B = PUP_A + 0.8;
  const LV_A = A + 1.1, LV_B = LV_A + 0.8;
  const RV_A = A + 0.5, RV_B = RV_A + 1.3;
  const TTL_A = PUP_B, TTL_B = TTL_A + 1.0;
  const BEATS = [0, A, RV_A, SQX_A, LV_A, ROLL_B, TTL_A, TTL_B];

  const CFG = { pupil: 0.45, fly: true };
  const svg = $("#main");
  const iris = $("#iris-pupil"), pupil = $("#pupil"), rv = $("#righteyeveins"), lv = $("#lefteyeveins");
  const fly = $("#Fly"), wingL = $("#left_wing"), wingR = $("#right_wing"), title = $("#Text");
  const lashes = [...document.querySelectorAll("#bottom_lashes path")];

  // the iris path: a "soft" bezier through these points, starting at rest
  const PTS = [[0, 0], [0, 8], [-104, -22], [-229, -5], [-344, 52]];
  const SEGS = [];
  { // quadratic segments: anchors at the ends and at the midpoints between control points
    const mids = [];
    for (let i = 1; i < PTS.length - 2; i++) mids.push([(PTS[i][0] + PTS[i + 1][0]) / 2, (PTS[i][1] + PTS[i + 1][1]) / 2]);
    const anchors = [PTS[0], ...mids, PTS[PTS.length - 1]];
    for (let i = 0; i < anchors.length - 1; i++) SEGS.push([anchors[i], PTS[i + 1], anchors[i + 1]]);
  }
  const quad = (s, u) => [0, 1].map((k) => (1 - u) * (1 - u) * s[0][k] + 2 * (1 - u) * u * s[1][k] + u * u * s[2][k]);
  // even speed along the curve: an arc-length table
  const LUT = [];
  {
    let len = 0, prev = quad(SEGS[0], 0);
    for (let i = 0; i < SEGS.length; i++) for (let j = 0; j <= 60; j++) {
      const p = quad(SEGS[i], j / 60);
      len += Math.hypot(p[0] - prev[0], p[1] - prev[1]); prev = p;
      LUT.push([len, p]);
    }
  }
  function along(f) {
    const target = f * LUT[LUT.length - 1][0];
    let lo = 0, hi = LUT.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (LUT[m][0] < target) lo = m; else hi = m; }
    const a = LUT[lo], b = LUT[hi], k = (target - a[0]) / ((b[0] - a[0]) || 1);
    return [lerp(a[1][0], b[1][0], k), lerp(a[1][1], b[1][1], k)];
  }

  // GSAP-style SVG transform: translate, then rotate and scale about an origin
  const tf = (el, x, y, rot, sx, sy, ox, oy) =>
    el.setAttribute("transform", `translate(${(x + ox).toFixed(3)} ${(y + oy).toFixed(3)}) rotate(${rot.toFixed(3)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(${(-ox).toFixed(3)} ${(-oy).toFixed(3)})`);
  let BB = null;

  // t is the timeline; buzz is the fly's own clock, which keeps running while the end is held
  function render(t, buzz = t - A) {
    if (!BB) BB = { iris: iris.getBBox(), lv: lv.getBBox(), rv: rv.getBBox(), wl: wingL.getBBox(), wr: wingR.getBBox(), lashes: lashes.map((l) => l.getBBox()) };
    const IC = [BB.iris.x + BB.iris.width / 2, BB.iris.y + BB.iris.height / 2];

    // ---- iris roll ----
    if (t < A) iris.removeAttribute("transform");
    else {
      const f = p1IO(win(t, A, ROLL_B));
      const [x, y] = along(f);
      const s = lerp(0.6, 1, f);
      let sx = s;
      if (t >= SQX_A) sx = lerp(lerp(0.6, 1, p1IO(win(SQX_A, A, ROLL_B))), 0.7, p1Out(win(t, SQX_A, SQX_A + 0.6)));
      tf(iris, x, y, 4, sx, s, IC[0], IC[1]);
    }
    // ---- pupil constricts ----
    const ps = lerp(1, CFG.pupil, p2IO(win(t, PUP_A, PUP_B)));
    tf(pupil, 0, 0, 0, ps, ps, 669.775, 215.313);
    // ---- veins ----
    const lvp = p1Out(win(t, LV_A, LV_B));
    tf(lv, -25 * lvp, 0, 0, lerp(1, 0.3, lvp), lerp(1, 0.3, lvp), BB.lv.x, BB.lv.y + BB.lv.height);
    rv.style.visibility = t >= RV_A ? "visible" : "hidden";
    const rvp = p1IO(win(t, RV_A, RV_B));
    tf(rv, lerp(100, 0, rvp), 0, 0, lerp(0.4, 1, rvp), lerp(0.4, 1, rvp), BB.rv.x + BB.rv.width, BB.rv.y + BB.rv.height);
    // ---- title ----
    title.style.opacity = win(t, TTL_A, TTL_B);
    title.style.visibility = t >= TTL_A ? "visible" : "hidden";

    // ---- the fly: wings beat (0.06s strokes, yoyo), body quivers every 0.2s ----
    fly.style.visibility = CFG.fly ? "visible" : "hidden";
    if (t >= A && CFG.fly) {
      const lt = buzz;
      [[wingL, BB.wl, 0], [wingR, BB.wr, 0.01]].forEach(([w, b, d]) => {
        const c = ((lt - d) % 0.14 + 0.14) % 0.14;
        const k = c < 0.07 ? clamp(c / 0.06) : clamp((0.14 - c) / 0.06);
        const rot = lerp(-40, 30, p1Out(k));
        tf(w, 0, 0, rot, 1, 1, b.x, b.y + b.height);
      });
      const n = Math.floor(lt / 0.2), u = p1Out((lt % 0.2) / 0.2);
      const q = (i, k) => (i < 0 ? 0 : hash(i, k) * 6 - 3);
      fly.setAttribute("transform", `translate(${lerp(q(n - 1, 1), q(n, 1), u).toFixed(3)} ${lerp(q(n - 1, 2), q(n, 2), u).toFixed(3)})`);
      // the lower lashes shiver with it, each a hair behind the last
      lashes.forEach((l, i) => {
        const li = lt - i * 0.01, m = Math.floor(li / 0.2), v = p1Out(((li % 0.2) + 0.2) % 0.2 / 0.2);
        const r = (j) => (j < 0 ? 0 : hash(j, 9) * 2 - 1);
        const b = BB.lashes[i];
        tf(l, 0, 0, li < 0 ? 0 : lerp(r(m - 1), r(m), v), 1, 1, b.x + b.width, b.y + b.height);
      });
    } else {
      wingL.removeAttribute("transform"); wingR.removeAttribute("transform"); fly.removeAttribute("transform");
      lashes.forEach((l) => l.removeAttribute("transform"));
    }
  }

  // Wide screens see the whole 924x520 frame; tall ones crop in on the eye and the title
  const fit = () => svg.setAttribute("viewBox", innerWidth / innerHeight < 1.3 ? "80 70 590 470" : "-86 38 924 520");
  addEventListener("resize", fit);
  fit();

  /* ---- playback: plays once and holds the last frame (the fly keeps buzzing);
     with autoplay it loops after a short hold. A click replays from the start. ---- */
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = reduce ? DUR : 0, buzz = 0, held = 0, speed = 1, loop = false, external = false, last = performance.now();
  const replay = () => { t = 0; buzz = 0; held = 0; };
  addEventListener("click", replay);

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000) * speed;
    last = now;
    if (!external) {
      if (t < DUR) t = Math.min(DUR, t + dt);
      else if (loop && (held += dt) > HOLD) replay();
      if (t < A) buzz = 0; else if (!reduce) buzz += dt;
      render(t, buzz);
    }
    requestAnimationFrame(frame);
  }

  // Frame-accurate capture: window.__renderAt(seconds) draws that instant and stops the clock
  window.__renderAt = async (s) => {
    external = true; render(s);
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  };

  /* ------------------------------------------------------------------
     Lab hooks (InstaLanding Motion). The page works on its own; when it
     is framed, the lab drives it with postMessage and it reports where
     the timeline is.
       ?autoplay=2000   loop the clip (previews); the number is ignored
       { source: 'il-motion', type: 'speed', value: 0.25 }
       { ..., type: 'step', value: 1 | -1 }        jump to the next / previous beat
       { ..., type: 'pupil', value: 0.45 }         how far the pupil tightens
       { ..., type: 'fly', value: true | false }   the fly and its shiver
       { ..., type: 'autoplay', value: true | false }   loop, or play once and hold
  ------------------------------------------------------------------ */
  const step = (dir) => {
    held = 0;
    if (dir > 0) { const b = BEATS.find((x) => x > t + 0.01); t = b === undefined ? 0 : b; }
    else { const b = [...BEATS].reverse().find((x) => x < t - 0.25); t = b === undefined ? BEATS[BEATS.length - 1] : b; }
    if (t < A) buzz = 0;
  };
  const qs = new URLSearchParams(location.search);
  if (qs.has("autoplay")) loop = true;
  addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.source !== 'il-motion') return;
    if (d.type === 'speed') speed = Math.max(0.05, Number(d.value) || 1);
    if (d.type === 'step') step(d.value > 0 ? 1 : -1);
    if (d.type === 'pupil') CFG.pupil = clamp(Number(d.value) || 0.45, 0.1, 1);
    if (d.type === 'fly') CFG.fly = Boolean(d.value);
    if (d.type === 'autoplay') { loop = Boolean(d.value); if (loop && t >= DUR) replay(); }
  });

  document.fonts.load('47px "Marcellus"').catch(() => {}).then(() => {
    last = performance.now();
    requestAnimationFrame(frame);
    window.__ready = true;
  });

  if (parent === window) return;
  const PHASES = [[A, "STILL · THE FLY WAITS"], [ROLL_B, "THE IRIS ROLLS"], [PUP_B, "THE PUPIL TIGHTENS"], [TTL_B, "THE TITLE FADES IN"], [Infinity, "HELD · CLICK TO REPLAY"]];
  let lastText = '';
  const report = () => {
    const phase = PHASES.find(([end]) => t < end)[1];
    const text = `${phase} · ${t.toFixed(1)}s / ${DUR.toFixed(1)}s`;
    if (text !== lastText) {
      lastText = text;
      parent.postMessage({ source: 'il-motion-demo', type: 'status', text }, '*');
    }
    requestAnimationFrame(report);
  };
  requestAnimationFrame(report);
})();
</script>
